name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Lua (for the plugin tests)
        run: sudo apt-get update && sudo apt-get install -y lua5.4 lua-dkjson
      - run: npm ci
      - name: Lua syntax check
        run: for f in extension/*.lua test/*.lua; do luac5.4 -p "$f"; done
      - run: node --test --test-reporter=spec
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 24
        with:
          name: aseprite-mcp-bridge
          path: dist/aseprite-mcp-bridge.aseprite-extension
